[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpmft"
version = "1.0.0"
description = "MiniCPM-o 4.5 full-duplex training and inference core for Gander."
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.10,<2",
  "av>=14,<18",
  "deepspeed>=0.19,<0.20",
  "librosa>=0.9,<0.11",
  "numpy>=1.26,<2",
  "pillow>=10",
  "pyarrow>=15",
  "pyyaml>=6",
  "safetensors>=0.4",
  "scipy>=1.11",
  "soundfile>=0.12",
  "torch>=2.6,<2.7",
  "tqdm>=4.66",
  "transformers==4.51.0",
]

[project.optional-dependencies]
talker = ["minicpmo-utils[tts]>=1.0.6,<2"]
asr = [
  "fastapi>=0.110",
  "faster-whisper>=1.2,<2",
  "uvicorn[standard]>=0.29",
]

[project.scripts]
mcpmft-train = "mcpmft.train.main:main"
mcpmft-launch = "mcpmft.launch:main"
mcpmft-infer = "mcpmft.infer.cli:main"
mcpmft-asr = "mcpmft.infer.asr:main"
mcpmft-data = "mcpmft.data_cli:main"

[tool.setuptools.packages.find]
include = ["mcpmft*"]

[tool.setuptools.package-data]
"mcpmft.infer" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"
