name: gander
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10
  - pip>=24
  - setuptools>=68,<81
  - wheel
  - pip:
      # CUDA 12.4 training and serving stack.
      - torch==2.6.0
      - torchvision==0.21.0
      - torchaudio==2.6.0

      - sentencepiece==0.2.1
      - tensorboard==2.20.0

      # Talker codec and waveform synthesis.
      - minicpmo-utils[tts]==1.0.6

      - -e ./minicpm_ft[talker,asr]
      - -e ./gander_runtime
